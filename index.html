<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>背景配色预览 · 科技感</title>
<style>
  body{font-family:system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;background:#20242e;color:#e8ecf4;margin:0;padding:26px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{font-size:13px;color:#9aa4b8;margin:0 0 20px}
  .grid{display:flex;flex-wrap:wrap;gap:20px}
  .item{width:360px}
  .cap{display:flex;align-items:baseline;gap:8px;margin:0 0 8px}
  .cap b{font-size:15px}
  .cap span{font-family:ui-monospace,monospace;font-size:11px;color:#8b93a6}
  .pick{font-size:11px;color:#6d7688;margin-top:6px}

  /* 迷你后台 mockup —— 结构与真实版一致 */
  .app{--bg:#DBDFEA;--panel:#EFF2F8;--panel2:#E4E8F1;--ink:#131826;--ink2:#525C72;--line:#CFD5E3;--rail:#131A2B;--rail2:#0D1220;--ac:#3B6FE0;--acsoft:#EAF0FD;
    display:grid;grid-template-columns:74px 1fr;height:250px;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.06)}
  .rail{background:linear-gradient(180deg,var(--rail),var(--rail2));padding:10px 8px;display:flex;flex-direction:column;gap:7px}
  .rl-brand{width:26px;height:26px;border-radius:7px;background:var(--ac);margin-bottom:6px}
  .rl{height:9px;border-radius:4px;background:rgba(255,255,255,.14)}
  .rl.on{background:var(--ac);opacity:.9}
  .rl.s{width:70%}
  .board{background:var(--bg);background-image:radial-gradient(circle,rgba(120,130,160,.14) 1px,transparent 1px);background-size:14px 14px;padding:12px;overflow:hidden}
  .tbar{display:flex;align-items:center;gap:7px;margin-bottom:10px}
  .ttl{font-size:12px;font-weight:800;color:var(--ink)}
  .btn{margin-left:auto;font-size:10px;font-weight:700;color:#fff;background:var(--ac);padding:5px 10px;border-radius:6px}
  .card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:9px;padding:10px 12px;margin-bottom:8px}
  .card .nm{font-size:11px;font-weight:800;color:var(--ink2)}
  .card .amt{font-size:20px;font-weight:900;color:var(--ink);letter-spacing:.02em}
  .chips{display:flex;gap:6px;margin-top:2px}
  .chip{font-size:9px;font-weight:800;padding:3px 7px;border-radius:5px;background:var(--acsoft);color:var(--ac)}

  /* ===== 5 组配色 ===== */
  .p1{--bg:#0A0E1A;--panel:#131B2E;--panel2:#1B2540;--ink:#EAF1FF;--ink2:#93A6D0;--line:#26324F;--rail:#060B16;--rail2:#020509;--ac:#00E5FF;--acsoft:#0c2b34}
  .p2{--bg:#171B26;--panel:#222A3A;--panel2:#2B3446;--ink:#EDF1F9;--ink2:#9BA6BD;--line:#333E52;--rail:#0F131C;--rail2:#080B12;--ac:#3B82F6;--acsoft:#16233f}
  .p3{--bg:#EDF3FC;--panel:#FFFFFF;--panel2:#F1F5FC;--ink:#0F1830;--ink2:#4A5878;--line:#DCE6F4;--rail:#141C2E;--rail2:#0C1220;--ac:#2563EB;--acsoft:#E4ECFD}
  .p4{--bg:#0C0A1A;--panel:#171233;--panel2:#221A47;--ink:#EFE9FF;--ink2:#A99BD6;--line:#2E2558;--rail:#0A0817;--rail2:#050310;--ac:#B96BFF;--acsoft:#241a45}
  .p5{--bg:#E5F1F4;--panel:#FFFFFF;--panel2:#E9F4F7;--ink:#0A2430;--ink2:#3C5A66;--line:#CFE4E9;--rail:#0E2A33;--rail2:#07191F;--ac:#06B6D4;--acsoft:#DBF1F5}
</style></head>
<body>
  <h1>背景配色预览 · 科技感 5 选 1</h1>
  <p class="sub">每一格都是你后台的缩小版（深色侧栏＋看板背景＋残留卡片＋主色按钮）。看中哪个，跟我说「用 X 号」就帮你换上去。</p>

  <div class="grid" id="grid"></div>

<script>
  const palettes = [
    {cls:'p1', name:'深空霓虹', hint:'全深色 · 青蓝霓虹', bg:'#0A0E1A', ac:'#00E5FF'},
    {cls:'p2', name:'石墨电光', hint:'深灰石墨 · 电光蓝', bg:'#171B26', ac:'#3B82F6'},
    {cls:'p3', name:'冷光洁白', hint:'亮白干净 · 比现在更清爽', bg:'#EDF3FC', ac:'#2563EB'},
    {cls:'p4', name:'赛博紫', hint:'全深色 · 紫色霓虹', bg:'#0C0A1A', ac:'#B96BFF'},
    {cls:'p5', name:'极地冰蓝', hint:'亮色 · 冰蓝/青', bg:'#E5F1F4', ac:'#06B6D4'},
  ];
  const mock = `
    <div class="rail">
      <div class="rl-brand"></div>
      <div class="rl s on"></div><div class="rl s"></div><div class="rl"></div>
      <div class="rl s"></div><div class="rl"></div><div class="rl s"></div>
    </div>
    <div class="board">
      <div class="tbar"><span class="ttl">残留总览</span><span class="btn">＋ 新增</span></div>
      <div class="card"><div class="nm">内部 · JJ卡转卡 ✎</div><div class="amt">8,320.322</div></div>
      <div class="card"><div class="nm">内部 · XQ小额卡卡 ✎</div><div class="amt">3,125.167</div>
        <div class="chips"><span class="chip">内部</span><span class="chip">费率 3.9%</span></div></div>
    </div>`;
  document.getElementById('grid').innerHTML = palettes.map((p,i)=>`
    <div class="item">
      <div class="cap"><b>${i+1}. ${p.name}</b><span>${p.hint}</span></div>
      <div class="app ${p.cls}">${mock}</div>
      <div class="pick">背景 ${p.bg} · 主色 ${p.ac}</div>
    </div>`).join('');
</script>
</body></html>
